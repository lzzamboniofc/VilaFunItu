name: Verificar prévia comercial
on:
  push:
    branches: [main]
  pull_request:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Auditar estrutura e copy
        run: npm run auditar
      - name: Verificar geração da prévia
        run: |
          npm run build
          git diff --exit-code -- index.html assets/css/preview.css assets/js/preview.js robots.txt
